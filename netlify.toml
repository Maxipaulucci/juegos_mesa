# Flutter no está en el build de Netlify: compilá local con
# `flutter build web` y después `netlify deploy --prod`.
# Importante: no uses solo `--dir=build/web` o no se suben las Functions.
[build]
  publish = "build/web"
  functions = "netlify/functions"

# API de salas (antes del catch-all de Flutter).
[[redirects]]
  from = "/api/sala"
  to = "/.netlify/functions/sala"
  status = 200

# Flutter web (SPA).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
