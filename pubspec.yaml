name: app_juegos_mesa
description: Juegos de mesa argentinos multijugador (salas por código).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  lottie: ^3.5.1
  google_fonts: ^8.2.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/fireworks_a.json
    - assets/lottie/fireworks_b.json
    - assets/lottie/fireworks_c.json
    - assets/img/portadas/portadaDiezMil.png
    - assets/img/portadas/portadaGenerala.png
    - assets/img/portadas/portadaProximamente.png
